<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link rel="stylesheet" href="css/styles.css">

<body>
    <header>
    <h1>Se parte de la comunidad,Postulate.</h1>
    </header>

<main>
    <form>
        <h2>Nombre/s y Apellido/s:</h2>
        <div class="nombre-apellido">
            <input type="text" placeholder="ej: Lionel Andres" required>
            <input type="text" placeholder="ej: Messi" required>
        </div>    
        
        <h2>Correo Electronico:</h2>
            <input type="email" placeholder="Sevienela4@hotmail.com" required>
        
        <h2>Celular Movil:</h2>
            <input type="text" placeholder="ej: 011 3859-7499" required>
        
        <h2>Selecciona Genero:</h2>
        <div class="genero">
            <label><input type="radio" name="genero">Masculino</label>
            <label><input type="radio" name="genero">Femenino</label>
            <label><input type="radio" name="genero">Therian</label>
        </div>

        <input class="boton-enviar" type="submit" value="Enviar formulario">
            
    </form>
</main>
